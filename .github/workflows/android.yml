name: Build Easy Phone APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if gradle --no-daemon --refresh-dependencies assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency repository may be rate-limiting requests; waiting before retry..."
              sleep 45
            fi
          done
          exit 1

      - name: Sign APK with shared release identity (when signing secrets are configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not configured. This artifact will remain debug-signed and is not a verified release build."
            exit 0
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.buildozer/android/platform/android-sdk}}"
          KEYSTORE="$RUNNER_TEMP/lux-apps-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found in $SDK_ROOT/build-tools"
            exit 1
          fi
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/debug/app-debug.apk)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK found to sign."
            exit 1
          fi
          for APK in "${APK_FILES[@]}"; do
            SIGNED="$RUNNER_TEMP/$(basename "${APK%.apk}")-release.apk"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$SIGNED" "$APK"
            "$APKSIGNER" verify --verbose "$SIGNED"
            cp "$SIGNED" "$APK"
          done
          rm -f "$KEYSTORE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyPhone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
